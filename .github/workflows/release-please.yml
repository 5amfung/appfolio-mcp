name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Update release pull request or publish release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN-created PR updates do not trigger pull_request workflows.
      # workflow_dispatch does, so release PR checks need no personal token.
      - name: Run CI on the generated release pull request
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          node --input-type=module <<'NODE'
          const pr = JSON.parse(process.env.RELEASE_PR)
          if (typeof pr.headBranchName !== 'string' ||
              !pr.headBranchName.startsWith('release-please--branches--main'))
            throw new Error('Unexpected Release Please branch')
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ref: pr.headBranchName}),
            },
          )
          if (response.status !== 204)
            throw new Error(`Release PR CI dispatch failed with HTTP ${response.status}`)
          NODE

      # Vercel's Git integration owns deployment. Both this check and its Ignored
      # Build Step use the same policy; no Vercel token or deploy hook is needed.
      - name: Verify the published release is eligible for production
        if: steps.release.outputs.release_created == 'true'
        env:
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ steps.release.outputs.sha }}
        run: node scripts/check-release.mjs

      - name: Record release deployment policy
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo 'Release published. Vercel may deploy the verified Release Please merge from main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No release published. Ordinary merges to main do not build or update production.' >> "$GITHUB_STEP_SUMMARY"
          fi
